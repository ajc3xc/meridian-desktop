# Native (non-Qt) runtimes in the MeridianDesktop ONEDIR bundle, and the Qt extension binaries.
#
# Read by packaging/build.py and packaging/verify_bundle.py. The build writes one section per
# [[runtime]] into THIRD_PARTY_LICENSES.txt. It fails when a listed file is missing from the
# bundle, when a bundled copy of a listed file has no digest for its path, and when a native
# runtime DLL in the bundle is not listed here. A bundled copy whose sha256 differs from the
# digest declared for its path is reported as RELEASE BLOCKED, and verify_bundle.py reports it
# as a problem.
#
# Each [[runtime]] table has:
#   name          the name in the section header
#   version       the version in the section header
#   spdx          the SPDX identifier in the section header
#   files         exact file names, without folder parts, as they appear in the bundle
#   sha256        a [runtime.sha256] table. Each key is the path of one bundled copy, relative
#                 to the bundle root (dist/MeridianDesktop), for example
#                 "_internal/python3.dll". Each value is that copy's 64-digit
#                 lower-case sha256. Every name in files needs at least one key, and every
#                 bundled copy of a listed name needs its own key. Several keys may share one
#                 file name. A key's file name must be in files.
#   notice_url    the upstream licence page (https)
#   licence_file  optional. A repo-relative licence text that packaging/licenses/SHA256SUMS
#                 pins. Without it, the text is packaging/licenses/native/<slug of name>.txt.
#
# Licence texts for the runtimes are pinned in packaging/licenses/native/ and listed in
# packaging/licenses/SHA256SUMS. They are the info/licenses files of the same conda packages.
#
# Versions: pixi env meridian-desktop-8257345453352236247 (env "default"), conda-meta files,
# read 2026-10-17. The Qt entry's version is PySide6 6.12.0 from its dist-info METADATA.
#
#
# CPython's extension modules (.pyd) are listed under CPython. No dist-info in the bundle owns them.
#
# Not listed here: Qt and its plugins, and the PySide6 and shiboken6 extension modules
# (QtCore.pyd, QtGui.pyd, QtWidgets.pyd, Shiboken.pyd). packaging/lgpl_manifest.toml covers them.
# The two extension binaries pyside6.abi3.dll and shiboken6.abi3.dll are listed in the Qt entry.

[[runtime]]
name = "CPython"
version = "3.12.15"
spdx = "PSF-2.0"
files = [
    "python312.dll",
    "python3.dll",
    "_asyncio.pyd",
    "_bz2.pyd",
    "_ctypes.pyd",
    "_decimal.pyd",
    "_hashlib.pyd",
    "_lzma.pyd",
    "_multiprocessing.pyd",
    "_overlapped.pyd",
    "_queue.pyd",
    "_socket.pyd",
    "_sqlite3.pyd",
    "_ssl.pyd",
    "_wmi.pyd",
    "pyexpat.pyd",
    "select.pyd",
    "unicodedata.pyd",
]
notice_url = "https://docs.python.org/3/license.html"

