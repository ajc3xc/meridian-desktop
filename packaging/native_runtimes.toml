# Microsoft runtime files are not bundled, so they have no entries here. The Visual C++ 2015-2022
# runtime (MSVCP140*.dll, VCRUNTIME140*.dll) and the Universal CRT (ucrtbase.dll and api-ms-win-*.dll)
# were removed on purpose. build.py deletes them from the bundle, and verify_bundle.py fails the build
# when any of them is present. Users install Microsoft's Visual C++ Redistributable (x64) first, from
# https://aka.ms/vs/17/release/vc_redist.x64.exe. The Universal CRT comes with Windows 10 and later.
# The names and patterns are in [microsoft_prerequisites] in packaging/lgpl_manifest.toml, and
# packaging/README.bundle.txt tells the user what to install.

# Qt for Python extension binaries (D4). pyside6.abi3.dll is in _internal/PySide6/ and
# shiboken6.abi3.dll is in _internal/shiboken6/. Both are pinned by path. Their licence is the
# elected Qt licence, LGPL-3.0-only (packaging/lgpl_manifest.toml). The gate accepts an
# LGPL-3.0-only runtime only when every file is under PySide6/ or shiboken6/.
[[runtime]]
name = "Qt for Python extension binaries"
version = "6.12.0"
spdx = "LGPL-3.0-only"
files = [
    "pyside6.abi3.dll",
    "shiboken6.abi3.dll",
]
notice_url = "https://www.qt.io/development/qt-framework/qt-licensing"
licence_file = "LICENSES/LGPL-3.0.txt"

[runtime.sha256]
"_internal/PySide6/pyside6.abi3.dll" = "d5b87ccb0a7c305854bd120242b0a75002d0b50a35532d0f6171e4ed0f3cc82a"
"_internal/shiboken6/shiboken6.abi3.dll" = "07c318c02be5a3a9f1475f5a2d0cd438f4d4ea3288c28e2e10bc5ebbbec8de86"

# PyInstaller (not a [[runtime]] entry). packaging/build.py writes two PyInstaller sections into
# THIRD_PARTY_LICENSES.txt, taken from PyInstaller's COPYING.txt:
#   - the bootloader and the boot module (pyiboot*): "GPL-2.0-or-later WITH Bootloader-exception"
#     (the Bootloader Exception);
#   - the run-time hooks and fake modules (_pyi_rth_*, pyi_rth_*, pyi_splash*): "Apache-2.0", with
#     the Apache-2.0 text.
# The verifier's [pyinstaller_bootloader] and [pyinstaller_runtime_hooks] tables in
# lgpl_manifest.toml carry the same mapping, and each passes only while NOTICE.md names
# PyInstaller and its licence.
