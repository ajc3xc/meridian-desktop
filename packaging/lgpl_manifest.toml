# LGPL manifest for MeridianDesktop. Read by packaging/verify_bundle.py.
#
# Qt licence election: PySide6 and the Qt libraries it ships are used under
# LGPL-3.0-only. This project elects that option only. It does not elect
# GPL-2.0-only, GPL-3.0-only, or the Qt commercial licence.
#
# Upstream metadata, copied verbatim from the installed PySide6 6.12.0
# dist-info METADATA (read 2026-10-14):
#   License: LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only
#   License-File: LicenseRef-Qt-Commercial.txt
# PySide6_Essentials, PySide6_Addons and shiboken6 carry the same License line.
#
# verify_bundle.py enforces this file on every build. A check that cannot run, or that
# finds a missing input, fails the build. Nothing in it can be overridden from the
# environment.

[pyside6]
version = "6.12.0"          # PySide6 dist-info METADATA
qt_version = "6.12.0"       # PySide6.QtCore.qVersion() in the pixi env, run 2026-10-14
elected_license = "LGPL-3.0-only"

[qt]
# Allowed Qt DLLs: the import closure of the PySide6 extension modules the app loads
# (QtCore, QtGui, QtWidgets) and of the platform and style plugins. Recomputed
# 2026-10-14 from PE import tables with pefile (scratch dll_closure.py).
# qwindows.dll imports Qt6Core and Qt6Gui. qmodernwindowsstyle.dll imports Qt6Core,
# Qt6Gui and Qt6Widgets. verify_bundle.py checks every Qt DLL and every Qt plugin in
# the bundle against this list, and checks their import tables.
allowed_dlls = ["Qt6Core", "Qt6Gui", "Qt6Widgets"]

# Plugin categories. platforms holds qwindows (the Windows platform plugin).
# styles holds qmodernwindowsstyle.
allowed_plugin_dirs = ["platforms", "styles"]
# File-level allowlist, relative to the plugins folder. Checked by verify_bundle and
# applied by build.py's prune step. qwindows is the Windows platform plugin the
# app needs. qoffscreen is the headless platform used only by --smoke. Its imports
# are Qt6Core and Qt6Gui, so it adds no forbidden DLLs. qmodernwindowsstyle is the
# Windows style. Everything else is pruned.
allowed_plugin_files = [
    "platforms/qwindows.dll",
    "platforms/qoffscreen.dll",
    "styles/qmodernwindowsstyle.dll",
]
allowed_non_qt_pyd = []

# Every other Qt6* DLL in the installed PySide6 folder. None is in the import closure
# of the allowed set. Excluded modules (build.py UNUSED_PYSIDE_MODULES) plus modules
# with no use here. Before removing an entry, re-run the closure check: Qt6Network,
# Qt6PrintSupport and Qt6Svg are plausible future needs.
forbidden_dlls = [
    "Qt63DAnimation", "Qt63DCore", "Qt63DExtras", "Qt63DInput", "Qt63DLogic",
    "Qt63DQuick", "Qt63DQuickAnimation", "Qt63DQuickExtras", "Qt63DQuickInput",
    "Qt63DQuickLogic", "Qt63DQuickRender", "Qt63DQuickScene2D", "Qt63DQuickScene3D",
    "Qt63DRender", "Qt6Bluetooth", "Qt6CanvasPainter", "Qt6Charts", "Qt6ChartsQml",
    "Qt6Concurrent", "Qt6DataVisualization", "Qt6DataVisualizationQml", "Qt6DBus",
    "Qt6Designer", "Qt6DesignerComponents", "Qt6Graphs", "Qt6Graphs2DImpl",
    "Qt6GraphsWidgets", "Qt6Help", "Qt6HttpServer", "Qt6LabsAnimation",
    "Qt6LabsFolderListModel", "Qt6LabsPlatform", "Qt6LabsQmlModels", "Qt6LabsSettings",
    "Qt6LabsSharedImage", "Qt6LabsStyleKit", "Qt6LabsStyleKitImpl",
    "Qt6LabsSynchronizer", "Qt6LabsWavefrontMesh", "Qt6Location", "Qt6Lottie",
    "Qt6LottieVectorImageGenerator", "Qt6LottieVectorImageHelpers", "Qt6Multimedia",
    "Qt6MultimediaQuick", "Qt6MultimediaWidgets", "Qt6Network", "Qt6NetworkAuth",
    "Qt6Nfc", "Qt6OpenGL", "Qt6OpenGLWidgets", "Qt6Pdf", "Qt6PdfQuick",
    "Qt6PdfWidgets", "Qt6Positioning", "Qt6PositioningQuick", "Qt6PrintSupport",
    "Qt6Qml", "Qt6QmlCompiler", "Qt6QmlCore", "Qt6QmlDesignSupport",
    "Qt6QmlLocalStorage", "Qt6QmlMeta", "Qt6QmlModels", "Qt6QmlNetwork",
    "Qt6QmlWorkerScript", "Qt6QmlXmlListModel", "Qt6Quick", "Qt6Quick3D",
    "Qt6Quick3DAssetImport", "Qt6Quick3DAssetUtils", "Qt6Quick3DEffects",
    "Qt6Quick3DGlslParser", "Qt6Quick3DHelpers", "Qt6Quick3DHelpersImpl",
    "Qt6Quick3DIblBaker", "Qt6Quick3DParticleEffects", "Qt6Quick3DParticles",
    "Qt6Quick3DPhysics", "Qt6Quick3DPhysicsHelpers", "Qt6Quick3DRuntimeRender",
    "Qt6Quick3DSpatialAudio", "Qt6Quick3DUtils", "Qt6Quick3DXr", "Qt6QuickControls2",
    "Qt6QuickControls2Basic", "Qt6QuickControls2BasicStyleImpl",
    "Qt6QuickControls2FluentWinUI3", "Qt6QuickControls2FluentWinUI3StyleImpl",
    "Qt6QuickControls2Fusion", "Qt6QuickControls2FusionStyleImpl",
    "Qt6QuickControls2Imagine", "Qt6QuickControls2ImagineStyleImpl",
    "Qt6QuickControls2Impl", "Qt6QuickControls2Material",
    "Qt6QuickControls2MaterialStyleImpl", "Qt6QuickControls2Native",
    "Qt6QuickControls2Universal", "Qt6QuickControls2UniversalStyleImpl",
    "Qt6QuickControls2Windows", "Qt6QuickControls2WindowsStyleImpl",
    "Qt6QuickDialogs2", "Qt6QuickDialogs2QuickImpl", "Qt6QuickDialogs2Utils",
    "Qt6QuickEffects", "Qt6QuickLayouts", "Qt6QuickNativeStyle", "Qt6QuickParticles",
    "Qt6QuickShapes", "Qt6QuickShapesDesignHelpers", "Qt6QuickTemplates2",
    "Qt6QuickTest", "Qt6QuickTimeline", "Qt6QuickTimelineBlendTrees",
    "Qt6QuickVectorImage", "Qt6QuickVectorImageGenerator",
    "Qt6QuickVectorImageHelpers", "Qt6QuickWidgets", "Qt6RemoteObjects",
    "Qt6RemoteObjectsQml", "Qt6Scxml", "Qt6ScxmlQml", "Qt6Sensors", "Qt6SensorsQuick",
    "Qt6SerialBus", "Qt6SerialPort", "Qt6ShaderTools", "Qt6SpatialAudio", "Qt6Sql",
