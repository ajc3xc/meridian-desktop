    "Qt6TextToSpeech", "Qt6UiTools", "Qt6VirtualKeyboard", "Qt6VirtualKeyboardQml",
    "Qt6VirtualKeyboardSettings", "Qt6WebChannel", "Qt6WebChannelQuick",
    "Qt6WebEngineCore", "Qt6WebEngineQuick", "Qt6WebEngineQuickDelegatesQml",
    "Qt6WebEngineWidgets", "Qt6WebSockets", "Qt6WebView", "Qt6WebViewQuick", "Qt6Xml",
