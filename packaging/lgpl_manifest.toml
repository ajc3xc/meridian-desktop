# LGPL manifest for MeridianDesktop. Read by packaging/verify_bundle.py.
#
# Qt licence election: PySide6 and the Qt libraries it ships are used under
# LGPL-3.0-only. This project elects that option only. It does not elect
# GPL-2.0-only, GPL-3.0-only, or the Qt commercial licence.
#
# Upstream metadata, copied verbatim from the installed PySide6 6.12.0
# dist-info METADATA (read 2026-10-14):
#   License: LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only
#   License-File: LicenseRef-Qt-Commercial.txt
# PySide6_Essentials, PySide6_Addons and shiboken6 carry the same License line.
#
# "unverified" below means not confirmed by a run. Wave 7 confirms those
# items against a real PyInstaller build.

[pyside6]
version = "6.12.0"          # PySide6 dist-info METADATA
qt_version = "6.12.0"       # PySide6.QtCore.qVersion() in the pixi env, run 2026-10-14
elected_license = "LGPL-3.0-only"

[qt]
# Allowed Qt DLLs: the import closure of the PySide6 extension modules the app loads
# (QtCore, QtGui, QtWidgets) and of the platform and style plugins. Recomputed
# 2026-10-14 from PE import tables with pefile (scratch dll_closure.py).
# qwindows.dll imports Qt6Core and Qt6Gui. qmodernwindowsstyle.dll imports Qt6Core,
# Qt6Gui and Qt6Widgets. Unverified until a PyInstaller build confirms the bundle.
allowed_dlls = ["Qt6Core", "Qt6Gui", "Qt6Widgets"]

# Plugin categories. platforms holds qwindows (the Windows platform plugin).
# styles holds qmodernwindowsstyle. Unverified until Wave 7.
allowed_plugin_dirs = ["platforms", "styles"]
# File-level allowlist, relative to the plugins folder. Checked by verify_bundle and
# applied by build.py's prune step. qwindows is the Windows platform plugin the
# app needs. qoffscreen is the headless platform used only by --smoke. Its imports
# are Qt6Core and Qt6Gui, so it adds no forbidden DLLs. qmodernwindowsstyle is the
# Windows style. Everything else is pruned.
allowed_plugin_files = [
    "platforms/qwindows.dll",
    "platforms/qoffscreen.dll",
    "styles/qmodernwindowsstyle.dll",
]
allowed_non_qt_pyd = []

# Every other Qt6* DLL in the installed PySide6 folder. None is in the import closure
# of the allowed set. Excluded modules (build.py UNUSED_PYSIDE_MODULES) plus modules
# with no use here. Before removing an entry, re-run the closure check: Qt6Network,
# Qt6PrintSupport and Qt6Svg are plausible future needs.
