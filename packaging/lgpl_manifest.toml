# Non-Qt DLLs in the PySide6 folder, classified explicitly. allowed_other_dlls are
# the MSVC runtime and PySide6's own core DLL, the only ones the closure needs.
# forbidden_other_dlls are FFmpeg (QtMultimedia), the Mesa software renderer, QML, and
# OpenMP and Concurrency runtimes. The verifier does not check these yet: it has no
# full bundle inventory until a build exists (Wave 7).
allowed_other_dlls = [
    "msvcp140", "msvcp140_1", "msvcp140_2", "vcruntime140", "vcruntime140_1",
    "pyside6.abi3",
]
forbidden_other_dlls = [
    "avcodec-63", "avformat-63", "avutil-61", "swresample-7", "swscale-10",
    "opengl32sw", "pyside6qml.abi3", "concrt140", "vcamp140", "vccorlib140",
    "vcomp140", "msvcp140_codecvt_ids",
]

# Expected Wave 7 conflict (unverified, reasoned from PyInstaller's plugin table):
# build.py does not exclude plugin categories. PyInstaller collects every DLL in the
# QtGui categories, including imageformats/qpdf, imageformats/qsvg,
# iconengines/qsvgicon, generic/qtuiotouchplugin and
# platforminputcontexts/qtvirtualkeyboardplugin. Those import forbidden DLLs. Expect
# verify_bundle to fail until build.py excludes those plugin files or the owner
# changes this policy.


[licenses]
# SPDX ids allowed for distributions outside the LGPL family. None is bundled
# outside the family today, so only the elected id is listed.
allowed_spdx = ["LGPL-3.0-only"]
# Distributions that carry the Qt election. The verifier accepts a License field
# that lists LGPL-3.0-only as one of its OR options.
lgpl_family = ["PySide6", "PySide6_Essentials", "PySide6_Addons", "shiboken6"]
# Licence records come from the installed distributions via importlib.metadata
# (standard library). The License strings above were read from the dist-info
# METADATA files.

[licenses.aliases]
# Raw License metadata string mapped to the elected SPDX id.
"LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only" = "LGPL-3.0-only"

[bundled]
# Distributions expected in the ONEDIR bundle. Unverified until Wave 7.
# PySide6_WebEngine and PySide6_Pdf 6.12.0.140 are installed in the pixi env as PySide6
# requirements, with the same LGPL line in their METADATA. They are not listed
# because build.py excludes their modules. Add them only if they land in the bundle.
distributions = ["PySide6", "PySide6_Essentials", "PySide6_Addons", "shiboken6"]

