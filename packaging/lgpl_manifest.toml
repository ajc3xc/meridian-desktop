# Non-Qt DLLs in the PySide6 folder, classified explicitly. allowed_other_dlls are
# the MSVC runtime and PySide6's own core DLL, the only ones the closure needs. The
# MSVC runtime must be named in packaging/native_runtimes.toml. pyside6.abi3 must be
# pinned in [hashes]. forbidden_other_dlls are FFmpeg (QtMultimedia), the Mesa software
# renderer, QML, and OpenMP and Concurrency runtimes. verify_bundle.py rejects any
# bundled DLL, PYD or EXE with one of these stems, and build.py prunes them.
allowed_other_dlls = [
    "msvcp140", "msvcp140_1", "msvcp140_2", "vcruntime140", "vcruntime140_1",
    "pyside6.abi3",
]
forbidden_other_dlls = [
    "avcodec-63", "avformat-63", "avutil-61", "swresample-7", "swscale-10",
    "opengl32sw", "pyside6qml.abi3", "concrt140", "vcamp140", "vccorlib140",
    "vcomp140", "msvcp140_codecvt_ids",
]

# Plugin files outside allowed_plugin_files, such as imageformats/qpdf,
# imageformats/qsvg, iconengines/qsvgicon, generic/qtuiotouchplugin and
# platforminputcontexts/qtvirtualkeyboardplugin, are collected by PyInstaller and then
# removed by build.py's prune_forbidden step. verify_bundle.py checks what remains. A
# plugin file that survives pruning fails the build.


[licenses]
# SPDX ids allowed for distributions shipped outside the LGPL family. Permissive
# licences only. verify_bundle.py rejects every GPL, AGPL and MPL licence, and every
# licence it cannot map to an id here. keyring 25.7.0 (MIT) ships in the bundle.
allowed_spdx = ["MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "PSF-2.0", "ISC", "0BSD", "Zlib", "Unlicense"]
# Distributions that carry the Qt election. The verifier accepts a License field
# that lists LGPL-3.0-only as one of its OR options. LGPL-3.0-only is accepted for
# these names only. Any other distribution that declares it fails the build.
# A file that more than one distribution's RECORD claims passes only when every claimant
# is in this list and they all carry the same License line (D1).
# PySide6_Pdf and PySide6_WebEngine (6.12.0.140) carry the same LGPL line in their METADATA.
# Their RECORD lists PySide6/__init__.py, the file that the PYZ module PySide6 is built from,
# so the PYZ owner check makes them owners of that module and they must pass the family rule.
lgpl_family = [
    "PySide6", "PySide6_Essentials", "PySide6_Addons", "shiboken6",
    "PySide6_Pdf", "PySide6_WebEngine",
]
# Licence records come from each bundled *.dist-info METADATA (the bundle inventory)
# and from the installed distributions via importlib.metadata (the environment check).
# Both read License-Expression, License and the License :: classifiers together. The
# statements must resolve to one SPDX id through [licenses.aliases]. When they disagree,
# or when the metadata is missing or ambiguous, the LICENSE or COPYING file is read, and
# a GPL or AGPL signature in it fails the distribution.

[licenses.aliases]
# Raw licence metadata string mapped to an SPDX id. A string with no entry here fails
# the build (fail closed). "BSD License" and "Apache Software License" are not mapped
# because they do not name the exact licence. A reviewer adds the exact SPDX form.
"LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only" = "LGPL-3.0-only"
"LGPL-3.0-only" = "LGPL-3.0-only"
"MIT" = "MIT"
"MIT License" = "MIT"
"BSD-2-Clause" = "BSD-2-Clause"
"BSD-3-Clause" = "BSD-3-Clause"
"Apache-2.0" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"PSF-2.0" = "PSF-2.0"
"Python Software Foundation License" = "PSF-2.0"
"ISC" = "ISC"
"ISC License (ISCL)" = "ISC"
"0BSD" = "0BSD"
"Zlib" = "Zlib"
"zlib/libpng License" = "Zlib"
"Unlicense" = "Unlicense"
"The Unlicense (Unlicense)" = "Unlicense"

[bundled]
# Distributions expected in the ONEDIR bundle. verify_bundle.py fails the build when a
# listed distribution has no *.dist-info in the bundle, or when its licence is not
# allowed. keyring ships in the bundle and is listed. Its own dependencies are not
# listed, because the bundle does not carry their dist-info (see the known gaps in
# verify_bundle.py).
# PySide6_WebEngine and PySide6_Pdf 6.12.0.140 are installed in the pixi env as PySide6
# requirements, with the same LGPL line in their METADATA. They are not listed
# because build.py excludes their modules. Add them only if they land in the bundle.
distributions = ["PySide6", "PySide6_Essentials", "PySide6_Addons", "shiboken6", "keyring"]

[system_dlls]
# Windows OS DLLs a bundled binary may import without shipping them. Exact lower-case
# file names, and the api-ms-win- API-set prefix. Each name is a Windows component, and
# the ICU names are the ICU libraries that Windows 10 1703 and later ship (icu.dll,
# icuin.dll and icuuc.dll are present in System32 on Windows 11). icuuc.dll is what
# Qt6Core.dll imports. The other names are OS DLLs that the Qt, Python and app binaries
# of the 2026-10-17 bundle import, read from their PE import tables.
names = [
    "kernel32.dll", "user32.dll", "gdi32.dll", "advapi32.dll", "shell32.dll",
    "ole32.dll", "oleaut32.dll", "ws2_32.dll", "bcrypt.dll", "crypt32.dll",
    "ucrtbase.dll", "icu.dll", "icuin.dll", "icuuc.dll",
    "authz.dll", "comctl32.dll", "comdlg32.dll", "d3d9.dll", "d3d11.dll", "d3d12.dll",
    "dwmapi.dll", "dwrite.dll", "dxgi.dll", "imm32.dll", "iphlpapi.dll", "mpr.dll",
    "mscms.dll", "netapi32.dll", "ntdll.dll", "propsys.dll", "rpcrt4.dll", "setupapi.dll",
    "shlwapi.dll", "uiautomationcore.dll", "userenv.dll", "uxtheme.dll", "version.dll",
    "winmm.dll", "wtsapi32.dll",
]
prefixes = ["api-ms-win-"]

[runtimes]
# SPDX ids allowed for native runtimes listed in packaging/native_runtimes.toml. Each
# runtime is named in NOTICE.md, and its header is in THIRD_PARTY_LICENSES.txt.
# bzip2-1.0.6 is the bzip2 licence id. MSL-1.0 is included because the licence audit
# cites MSL section 6, so a component of the bundle is under MSL-1.0. Counsel must
# confirm which runtime it covers.
# The two Microsoft ids cover only the redistributable runtime files listed in
# native_runtimes.toml: LicenseRef-Microsoft-VC-Redist for the Visual C++ runtime, and
# LicenseRef-Microsoft-Windows-SDK for the UCRT and api-ms-win stubs.
allowed_spdx = [
    "PSF-2.0", "Apache-2.0", "MIT", "Zlib", "0BSD", "bzip2-1.0.6", "MSL-1.0",
    "LicenseRef-Microsoft-VC-Redist", "LicenseRef-Microsoft-Windows-SDK",
]
# Runtime digests in native_runtimes.toml are keyed by path relative to the bundle root
# (D2). The Visual C++ runtime appears twice, as 14.44 under _internal/PySide6/ and
# _internal/shiboken6/ and as 14.51 at _internal/. Each copy has its own digest.
# LGPL-3.0-only is not on this list. The gate accepts an LGPL-3.0-only runtime (the Qt
# extension binaries, D4) only when every one of its files is under _internal/PySide6/ or
# _internal/shiboken6/.

[source_offer]
# Hosts that a URL in OFFER-SOURCE.md may use. Every URL there must be https and must
# name one of these hosts exactly. Add the owner's own source host here once it is
# chosen. Until then the offer cannot pass.
hosts = ["download.qt.io", "code.qt.io"]

[pyz_owners]
# PYZ modules that no installed distribution's RECORD lists. The verifier looks each PYZ
# module up in the build interpreter's RECORD files first. A module with no RECORD owner
# passes only when it is in the standard library (owned by the CPython runtime, PSF-2.0,
# listed in native_runtimes.toml) or in first_party. Any other module fails, and the
# message names it. first_party is the project's own package, which the repository
# licence covers, not a third-party licence check.
stdlib_owner = "CPython"
stdlib_spdx = "PSF-2.0"
first_party = ["meridian_desktop"]

# PyInstaller's own bootstrap code is not one licence. Its COPYING.txt (the PyInstaller
# licensing terms) says so, and the SPDX identifiers in the source headers agree:
#   - the bootloader and PyInstaller/loader files are GPL-2.0-or-later WITH
#     Bootloader-exception, which grants unlimited permission to embed the bootloader in
#     programs distributed without restriction from those files;
#   - the run-time hooks (PyInstaller/hooks/rthooks, pyi_rth_*) and the fake modules
#     (pyi_splash and _pyi_rth_utils) are Apache-2.0.
# A PYZ module is attributed to PyInstaller only when no installed RECORD lists it and its
# name matches one table's module_patterns. It then passes only while NOTICE.md names
# notice_name and THIRD_PARTY_LICENSES.txt carries every copying_markers text.
# Source: https://raw.githubusercontent.com/pyinstaller/pyinstaller/develop/COPYING.txt

[pyinstaller_runtime_hooks]
notice_name = "PyInstaller"
licence = "Apache-2.0"
module_patterns = ["_pyi_rth_*", "pyi_rth_*", "pyi_splash*"]
copying_markers = ["Apache License", "Version 2.0, January 2004"]

[pyinstaller_bootloader]
notice_name = "PyInstaller"
licence = "GPL-2.0-or-later WITH Bootloader-exception"
module_patterns = ["pyiboot*"]
copying_markers = ["GNU GENERAL PUBLIC LICENSE", "Version 2, June 1991", "Bootloader Exception"]

# sha256 of every Qt6*.dll and Qt plugin. verify_bundle.py writes this table on the
# first verified build. [hashes] must stay the last table in this file, because
# write_hashes rewrites it in place.

[hashes]
