[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-desktop"
version = "0.2.0"
description = "Local coordination desktop for Meridian (PySide6). Wave 1 skeleton."
readme = "README.md"
# requires-python is 3.10 for now: the only interpreter on this machine is
# 3.10.11. The Meridian core needs Python 3.12, so this must be raised before
# any core import. Owner decision: PLAN.md, "Owner decisions needed", item 3.
requires-python = ">=3.10"
# The repo license is TBD-owner (PLAN.md), so no license field is set here.
dependencies = [
    "PySide6==6.12.0",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pefile==2024.8.26",
    "pyinstaller==6.22.3",
]

[project.scripts]
meridian-desktop = "meridian_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["meridian_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
